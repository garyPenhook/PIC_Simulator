# LEDs and an OLED on the pins the program uses. Run:  basil-sim prog.hex --stim tests/sim/board_example.stim.toml
fosc_mhz = 64       # the PIC clock; the OLED's scrolling runs on real time

[[led]]
pin = "RB0"
name = "heartbeat"

[[led]]
pin = "RB1"
active = "low"      # wired from Vdd through the pin
name = "error"

[[oled]]
bus = "i2c1"        # hardware MSSP1; use "gpio" for bit-banged I2C
scl = "RC3"
sda = "RC4"
address = 0x3C
height = 64
external_vcc = false  # the code must send 8Dh 14h before AFh, or the panel stays dark
